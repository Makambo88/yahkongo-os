<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <!-- Fond transparent -->
  <rect width="100%" height="100%" fill="none"/>
  
  <!-- Ligne décorative sous le texte -->
  <line x1="100" y1="160" x2="700" y2="160" stroke="#D4AF37" stroke-width="4" />
  
  <!-- Texte principal YAHKONGO -->
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" 
        font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" 
        font-size="90" font-weight="bold" fill="#D4AF37" letter-spacing="8">
    YAHKONGO
  </text>
  
  <!-- Texte secondaire OS -->
  <text x="50%" y="85%" dominant-baseline="middle" text-anchor="middle" 
        font-family="'Montserrat', 'Arial', sans-serif" 
        font-size="40" font-weight="300" fill="#FFFFFF" letter-spacing="20">
    O S
  </text>
</svg>
